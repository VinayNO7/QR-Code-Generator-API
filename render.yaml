services:
  - type: web
    name: qr-code-generator-api
    runtime: docker
    # Free services are suitable for a short-lived demo. Their filesystem is
    # ephemeral, so the SQLite database is reset when Render restarts/sleeps.
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: QR_API_SECRET
        generateValue: true
      - key: QR_DATABASE_PATH
        value: /tmp/qr_api.db
      - key: QR_TOKEN_TTL_MINUTES
        value: "1440"
